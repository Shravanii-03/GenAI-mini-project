name: Real-data experiments on ROAD (manual or tag)

# E8 (detectors on real attacks) and E15 (authentication + silence watchdog on real attacks) in the cloud.
#   - by hand: GitHub -> Actions -> "Real-data experiments on ROAD" -> Run workflow
#   - or push a tag:   git tag road-YYYYMMDD && git push origin road-YYYYMMDD
# The logs are pushed to the orphan branch `repro-results-road`.

on:
  workflow_dispatch:
  push:
    tags:
      - "road-*"

permissions:
  contents: write

jobs:
  road:
    name: Real-data experiments (ROAD)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download ROAD (Zenodo record 10462796, CC-BY 4.0) and verify it
        run: |
          curl -sL --retry 3 -o road.zip "https://zenodo.org/api/records/10462796/files/road.zip/content"
          ls -l road.zip
          echo "cab184cfc2fe12c0834bc46188c0f330  road.zip" | md5sum -c -
          unzip -q road.zip -d road_data
          DIR=$(find road_data -type d -name signal_extractions -not -path "*/__MACOSX/*" | head -1)
          test -n "$DIR"
          echo "ROAD_DIR=$(dirname "$DIR")" >> "$GITHUB_ENV"
          echo "using $(dirname "$DIR")"; ls "$(dirname "$DIR")" | head

      - name: E8 - detectors on real attacks
        run: |
          set -o pipefail
          python -u experiments/e8_road_validation.py 2>&1 | tee e8_road.log

      - name: E15 - authentication and silence watchdog on real attacks
        run: |
          set -o pipefail
          python -u experiments/e15_road_defence_replay.py 2>&1 | tee e15_road.log

      - name: Publish the logs
        if: always()
        run: |
          mkdir -p /tmp/results
          cp e8_road.log e15_road.log /tmp/results/ || true
          echo "${{ github.sha }}" > /tmp/results/COMMIT.txt
          cd /tmp/results
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b repro-results-road
          git add -A
          git commit -q -m "ROAD experiments for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repro-results-road
